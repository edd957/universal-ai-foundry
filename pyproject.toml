[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ai-foundry"
version = "0.1.0"
description = "Portable AI Capsule foundation for local generative AI training workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eddy / Codex" }]
keywords = [
    "generative-ai",
    "machine-learning",
    "local-training",
    "llm",
    "diffusion",
    "ai-containers",
    "mlops",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
llm = [
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "datasets>=2.20.0",
    "accelerate>=0.33.0",
    "peft>=0.12.0",
]
image = [
    "torch>=2.3.0",
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "safetensors>=0.4.0",
]
audio = [
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]
video = [
    "torch>=2.3.0",
    "diffusers>=0.30.0",
    "opencv-python>=4.10.0",
    "safetensors>=0.4.0",
]

[project.scripts]
uaf = "universal_ai_foundry.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
universal_ai_foundry = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["universal_ai_foundry"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=universal_ai_foundry --cov-report=term-missing"
